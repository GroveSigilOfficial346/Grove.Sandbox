<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Grove — A World Connected</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 26px 7%;
      border-bottom: 1px solid #202020;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 76px);
      letter-spacing: 5px;
      margin-bottom: 18px;
    }

    .subtitle {
      color: #888;
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 38px;
    }

    .enter {
      padding: 14px 38px;
      border: 1px solid #555;
      border-radius: 3px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
      transition: 0.2s;
    }

    .enter:hover {
      background: white;
      color: black;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">GROVE</div>
  </header>

  <main>
    <h1>GROVE</h1>

    <p class="subtitle">
      A WORLD CONNECTED
    </p>

    <a class="enter" href="login.html">
      ENTER GROVE
    </a>
  </main>

  <footer>
    GROVE © 2026
  </footer>

</body>
</html>

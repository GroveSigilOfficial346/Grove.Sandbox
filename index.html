<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050019">
<title>Grove — Coming Soon</title>

<style>
:root {
  --bg: #050019;
  --violet: #851eff;
  --magenta: #eb36ed;
  --cyan: #05c9f4;
  --white: #f7f5ff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--white);
  background:
    radial-gradient(ellipse at 50% 44%, #211044 0%, transparent 43%),
    radial-gradient(ellipse at 50% 100%, #10113b 0%, transparent 55%),
    var(--bg);
  font-family: Arial, Helvetica, sans-serif;
}

#particles {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.ambient {
  position: fixed;
  width: min(85vw, 650px);
  aspect-ratio: 1;
  left: 50%;
  top: 43%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(
    circle, #851eff1c 0%, #353bff0b 42%, transparent 70%
  );
  filter: blur(12px);
  animation: ambientPulse 7s ease-in-out infinite;
  pointer-events: none;
}

main {
  position: relative;
  z-index: 1;
  width: 100%;
  padding: 24px;
  text-align: center;
}

.logo {
  display: block;
  width: min(65vw, 270px);
  height: auto;
  margin: 0 auto 4px;
  overflow: visible;
  filter: drop-shadow(0 0 18px #851eff55);
  animation: logoFloat 6s ease-in-out infinite;
}

.branch {
  fill: none;
  stroke: url(#branchGradient);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.node {
  fill: #08051b;
  stroke: url(#branchGradient);
  stroke-width: 2;
}

.node-light {
  fill: var(--cyan);
  filter: url(#glow);
}

.orbit {
  fill: none;
  stroke: var(--violet);
  stroke-width: 1;
  opacity: .22;
}

h1 {
  margin: 8px 0 0;
  font-size: clamp(42px, 9vw, 68px);
  font-weight: 500;
  letter-spacing: .25em;
  text-indent: .25em;
  background: linear-gradient(
    100deg, var(--magenta), var(--white) 48%, var(--cyan)
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.divider {
  width: 100px;
  height: 2px;
  margin: 25px auto;
  background: linear-gradient(
    90deg, var(--violet), var(--magenta), var(--cyan)
  );
  box-shadow: 0 0 18px #851eff77;
}

.status {
  margin: 0;
  color: #d4c9f0;
  font-size: 12px;
  letter-spacing: .42em;
  text-indent: .42em;
  text-transform: uppercase;
}

.tagline {
  margin-top: 30px;
  color: #8179a7;
  font-size: 10px;
  letter-spacing: .3em;
  text-indent: .3em;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

@keyframes ambientPulse {
  0%, 100% { opacity: .65; transform: translate(-50%, -50%) scale(.92); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

@media (max-width: 420px) {
  .status { font-size: 10px; }
  .tagline { font-size: 9px; }
}
</style>
</head>

<body>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="ambient" aria-hidden="true"></div>

<main>
  <svg class="logo" viewBox="0 0 240 240"
       xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="Grove neural tree">

    <defs>
      <linearGradient id="branchGradient"
        x1="30" y1="20" x2="210" y2="220"
        gradientUnits="userSpaceOnUse">
        <stop stop-color="#eb36ed"/>
        <stop offset=".5" stop-color="#851eff"/>
        <stop offset="1" stop-color="#05c9f4"/>
      </linearGradient>

      <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <radialGradient id="coreGradient">
        <stop stop-color="#f7f5ff"/>
        <stop offset=".35" stop-color="#05c9f4"/>
        <stop offset="1" stop-color="#851eff" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Organic neural branches -->
    <g class="branch">
      <path d="M120 207 V157"/>
      <path d="M120 177 Q103 164 91 147 V115"/>
      <path d="M120 177 Q140 162 151 143 V108"/>
      <path d="M91 132 L65 109 V79"/>
      <path d="M91 147 H58 L39 127"/>
      <path d="M151 124 L178 100 V72"/>
      <path d="M151 143 H184 L202 124"/>
      <path d="M120 157 L103 118 L120 86"/>
      <path d="M120 157 L138 118 L120 86"/>
      <path d="M65 91 L49 73"/>
      <path d="M178 84 L195 65"/>
      <path d="M120 86 V57"/>
      <path d="M58 147 L47 164"/>
      <path d="M184 147 L195 164"/>
    </g>

    <!-- Neural connection points -->
    <g class="node">
      <circle cx="120" cy="207" r="4"/>
      <circle cx="91" cy="115" r="4.5"/>
      <circle cx="151" cy="108" r="4.5"/>
      <circle cx="65" cy="79" r="4.5"/>
      <circle cx="39" cy="127" r="4"/>
      <circle cx="178" cy="72" r="4.5"/>
      <circle cx="202" cy="124" r="4"/>
      <circle cx="120" cy="57" r="4.5"/>
      <circle cx="49" cy="73" r="3.5"/>
      <circle cx="195" cy="65" r="3.5"/>
      <circle cx="47" cy="164" r="3.5"/>
      <circle cx="195" cy="164" r="3.5"/>
    </g>

    <!-- Central living core -->
    <circle cx="120" cy="157" r="28"
      fill="url(#coreGradient)" opacity=".75"/>
    <circle cx="120" cy="157" r="13"
      fill="none" stroke="#05c9f4" stroke-opacity=".8"/>
    <circle cx="120" cy="157" r="5" class="node-light"/>

    <!-- Organic orbital ring -->
    <ellipse class="orbit" cx="120" cy="137"
      rx="82" ry="94" transform="rotate(28 120 137)"/>
  </svg>

  <h1>GROVE</h1>
  <div class="divider"></div>
  <p class="status">Coming Soon</p>
  <div class="tagline">A WORLD CONNECTED</div>
</main>

<script>
(() => {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  let width, height, particles = [], frame;
  const colors = ["#851eff", "#05c9f4", "#eb36ed"];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = reducedMotion.matches
      ? 0
      : Math.min(65, Math.floor(width * height / 14000));

    particles = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 1.5 + .4,
      speed: Math.random() * .28 + .08,
      drift: (Math.random() - .5) * .25,
      alpha: Math.random() * .5 + .15,
      color: colors[Math.floor(Math.random() * colors.length)]
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    for (const p of particles) {
      p.y -= p.speed;
      p.x += p.drift;

      if (p.y < -5) {
        p.y = height + 5;
        p.x = Math.random() * width;
      }
      if (p.x < -5) p.x = width + 5;
      if (p.x > width + 5) p.x = -5;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    frame = requestAnimationFrame(draw);
  }

  function start() {
    cancelAnimationFrame(frame);
    if (reducedMotion.matches) {
      ctx.clearRect(0, 0, width, height);
      return;
    }
    draw();
  }

  window.addEventListener("resize", () => {
    resize();
    start();
  });

  reducedMotion.addEventListener?.("change", () => {
    resize();
    start();
  });

  resize();
  start();
})();
</script>
</body>
</html>

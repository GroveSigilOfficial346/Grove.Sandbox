<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Grove — Sandbox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 12px;
    }

    .environment {
      position: fixed;
      top: 22px;
      right: 24px;
      color: #777;
      font-size: 10px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <div class="environment">SANDBOX</div>
  <h1>GROVE</h1>

  <script src="js/config.js"></script>
  <script type="module" src="js/supabase.js"></script>

</html>

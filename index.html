<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>GROVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .corner {
      position: fixed;
      top: 20px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .environment {
      color: #777;
    }

    .admin {
      color: #fff;
      text-decoration: none;
    }

    .admin:hover {
      color: #999;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 8px;
    }
  </style>
</head>

<body>
  <nav class="corner">
    <span class="environment">SANDBOX</span>
    <a class="admin" href="/admin/">ADMIN</a>
  </nav>

  <h1>GROVE</h1>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community — Grove</title>
  <link rel="stylesheet" href="css/feed.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="index.html">GROVE.</a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="profile.html">MY PROFILE</a>
      <a href="follows.html">FOLLOWERS</a>
      <a href="notifications.html">NOTIFICATIONS</a>
      <button id="logout-button" type="button" hidden>LOG OUT</button>
    </nav>
  </header>

  <main class="feed-shell">
    <header class="feed-heading">
      <p class="eyebrow">GROVE COMMUNITY</p>
      <h1>The Feed</h1>
      <p>What's happening in Grove.</p>
    </header>

    <section id="composer" class="composer" hidden>
      <form id="post-form">
        <label for="post-body">CREATE A POST</label>
        <textarea
          id="post-body"
          maxlength="5000"
          rows="4"
          placeholder="Share something with Grove..."
          required
        ></textarea>

        <div class="composer-footer">
          <select id="post-visibility" aria-label="Post visibility">
            <option value="public">Public</option>
            <option value="followers">Followers</option>
            <option value="private">Only me</option>
          </select>
          <button id="publish-button" type="submit">PUBLISH</button>
        </div>

        <p id="composer-status" class="status" role="status"></p>
      </form>
    </section>

    <section class="feed-section">
      <div class="feed-toolbar">
        <h2>RECENT POSTS</h2>
        <button id="refresh-button" type="button">REFRESH</button>
      </div>

      <p id="feed-status" class="status" role="status" aria-live="polite">
        Loading Grove...
      </p>

      <div id="post-list" class="post-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>

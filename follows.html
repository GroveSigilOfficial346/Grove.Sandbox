<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Followers — Grove</title>
  <link rel="stylesheet" href="css/follows.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="index.html">GROVE.</a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="feed.html">COMMUNITY</a>
      <a href="profile.html">MY PROFILE</a>
      <a href="notifications.html">NOTIFICATIONS</a>
      <button id="logout-button" type="button">LOG OUT</button>
    </nav>
  </header>

  <main class="follows-shell">
    <header class="page-heading">
      <p class="eyebrow">YOUR GROVE NETWORK</p>
      <h1>Followers</h1>
      <p>Manage your connections and follow requests.</p>
    </header>

    <p id="page-status" class="status" role="status"
      aria-live="polite">Loading your network...</p>

    <section class="network-section">
      <div class="section-heading">
        <h2>FOLLOW REQUESTS</h2>
        <span id="incoming-count" class="count">0</span>
      </div>
      <div id="incoming-list" class="network-list"></div>
    </section>

    <section class="network-section">
      <div class="section-heading">
        <h2>SENT REQUESTS</h2>
        <span id="outgoing-count" class="count">0</span>
      </div>
      <div id="outgoing-list" class="network-list"></div>
    </section>

    <section class="network-section">
      <div class="section-heading">
        <h2>YOUR FOLLOWERS</h2>
        <span id="followers-count" class="count">0</span>
      </div>
      <div id="followers-list" class="network-list"></div>
    </section>

    <section class="network-section">
      <div class="section-heading">
        <h2>FOLLOWING</h2>
        <span id="following-count" class="count">0</span>
      </div>
      <div id="following-list" class="network-list"></div>
    </section>

    <button id="refresh-button" class="refresh-button" type="button">
      REFRESH NETWORK
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/follows.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Grove</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="brand">GROVE.</div>

    <section class="auth-card">
      <h2>WELCOME BACK</h2>

      <form data-auth-form="login">
        <label for="email">EMAIL</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        >

        <label for="password">PASSWORD</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          placeholder="Your password"
        >

        <button type="submit">LOG IN</button>
        <p class="auth-status" data-auth-status aria-live="polite"></p>
      </form>
    </section>

    <nav class="auth-links">
      New to Grove?
      <a href="signup.html">Create an account</a><br>
      <a href="index.html">Back to Grove</a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>

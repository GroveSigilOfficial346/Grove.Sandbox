<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050019">
  <title>Grove — Account Access</title>

  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/login.js"></script>
</head>

<body>

<main class="auth-container">

  <img
    src="assets/neural-tree.svg"
    alt="Grove neural tree"
    class="auth-logo"
  >

  <h1>GROVE</h1>
  <p class="subtitle">A WORLD CONNECTED</p>

  <!-- LOGIN -->
  <section id="login-panel">
    <h2>Welcome Back</h2>

    <form id="login-form">
      <input
        id="login-email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="login-password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <p class="switch">
      New to Grove?
      <button type="button" id="show-register">
        Create Account
      </button>
    </p>
  </section>

  <!-- REGISTRATION -->
  <section id="register-panel" hidden>
    <h2>Create Your Account</h2>

    <form id="register-form">
      <input
        id="register-email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="register-password"
        type="password"
        placeholder="Create password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button type="submit">Join Grove</button>
    </form>

    <p class="switch">
      Already a member?
      <button type="button" id="show-login">
        Log In
      </button>
    </p>
  </section>

  <p id="auth-message" role="status" aria-live="polite"></p>

  <a href="/" class="back-link">Return Home</a>

</main>

</body>
</html>

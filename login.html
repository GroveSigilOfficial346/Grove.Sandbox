<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Login — Grove</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 390px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 42px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 3px;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #f5f5f5;
      color: #080808;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }

    .links {
      margin-top: 25px;
      text-align: center;
      font-size: 13px;
      line-height: 2.5;
      color: #888;
    }

    a {
      color: white;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="login">

    <div class="logo">GROVE</div>
    <div class="subtitle">A WORLD CONNECTED</div>

    <h2>Welcome back.</h2>

    <form id="login-form">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="Your email address"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Your password"
        required
      >

      <button type="submit">SIGN IN</button>

    </form>

    <div class="links">
      <div><a href="signup.html">Create an account</a></div>
      <div><a href="reset-password.html">Forgot password?</a></div>
    </div>

    <a class="back" href="index.html">← Back to Grove</a>

  </main>

  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>

</body>
</html>

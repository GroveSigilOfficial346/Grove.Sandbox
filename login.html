<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <title>Grove — Account Access</title>

  <link rel="stylesheet" href="css/auth.css?v=20261111-2">
  <link rel="stylesheet" href="css/grove-warm-controls.css?v=20261111-2">

  <script type="module" src="js/login.js?v=20261104-3"></script>
</head>

<body>
  <main class="auth-container">

    <img
      src="assets/neural-tree.svg"
      alt="Grove neural tree"
      class="auth-logo"
    >

    <h1>GROVE</h1>
    <p class="subtitle">A WORLD CONNECTED</p>

    <p id="session-notice" class="session-notice" hidden>
      You already have an active session.
      <a href="/profile.html">Open your profile</a>
    </p>

    <section id="login-panel">
      <h2>Welcome Back</h2>

      <form id="login-form">
        <input
          id="login-email"
          type="email"
          placeholder="Email address"
          autocomplete="username"
          required
        >

        <input
          id="login-password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <label class="remember-row" for="login-remember">
          <input id="login-remember" type="checkbox">
          <span>Remember me on this device</span>
        </label>

        <button type="submit">Log In</button>
      </form>

      <p class="switch">
        New to Grove?
        <button type="button" id="show-register">
          Create Account
        </button>
      </p>
    </section>

    <section id="register-panel" hidden>
      <h2>Create Your Account</h2>

      <form id="register-form">
        <input
          id="register-username"
          type="text"
          placeholder="Choose a username"
          autocomplete="username"
          minlength="3"
          maxlength="30"
          pattern="[a-zA-Z0-9_]+"
          title="Use 3–30 letters, numbers, or underscores."
          required
        >

        <input
          id="register-email"
          type="email"
          placeholder="Email address"
          autocomplete="email"
          required
        >

        <input
          id="register-password"
          type="password"
          placeholder="Create password"
          autocomplete="new-password"
          minlength="8"
          required
        >

        <label class="remember-row" for="register-remember">
          <input id="register-remember" type="checkbox">
          <span>Remember me on this device</span>
        </label>

        <button type="submit">Join Grove</button>
      </form>

      <p class="switch">
        Already a member?
        <button type="button" id="show-login">
          Log In
        </button>
      </p>
    </section>

    <p id="auth-message" role="status" aria-live="polite"></p>

    <a href="/" class="back-link">Return Home</a>

  </main>
</body>
</html>

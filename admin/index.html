<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROVE — ADMIN</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 360px; }
    .environment {
      position: absolute;
      top: 20px;
      right: 24px;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
    }
    h1 {
      text-align: center;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 6px;
      margin: 0 0 12px;
    }
    .subtitle {
      text-align: center;
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 42px;
    }
    label {
      display: block;
      color: #999;
      font-size: 12px;
      margin: 18px 0 8px;
    }
    input {
      width: 100%;
      padding: 13px;
      color: #fff;
      background: #101010;
      border: 1px solid #292929;
      border-radius: 3px;
      outline: none;
    }
    input:focus { border-color: #777; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #eee;
      color: #000;
      border: 0;
      border-radius: 3px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #message {
      min-height: 20px;
      margin-top: 18px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
    #console { text-align: center; }
    #console p { color: #888; font-size: 13px; }
    .back {
      display: block;
      margin-top: 30px;
      color: #777;
      text-align: center;
      font-size: 12px;
      text-decoration: none;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="environment">SANDBOX</div>

  <main>
    <section id="login">
      <h1>GROVE</h1>
      <div class="subtitle">ADMINISTRATION</div>

      <form id="login-form">
        <label for="email">EMAIL</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="login-button" type="submit">SIGN IN</button>
      </form>
    </section>

    <section id="console" hidden>
      <h1>GROVE</h1>
      <div class="subtitle">ADMIN CONSOLE</div>
      <p>You are signed in.</p>
      <button id="signout-button" type="button">SIGN OUT</button>
    </section>

    <div id="message" role="status"></div>
    <a class="back" href="/">RETURN TO GROVE</a>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.119.2";

    const supabase = createClient(
      "https://sbeiqnmtwbhesmocqmuk.supabase.co",
      "sb_publishable_Y3v6vOl71LIJumZ_m7ANFA_fy1SrYJv"
    );

    const login = document.getElementById("login");
    const consolePanel = document.getElementById("console");
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const message = document.getElementById("message");

    function showSession(isSignedIn) {
      login.hidden = isSignedIn;
      consolePanel.hidden = !isSignedIn;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) throw error;

        showSession(true);
        message.textContent = "Signed in successfully.";
        form.reset();
      } catch (error) {
        message.textContent = error.message || "Sign-in failed.";
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("signout-button").addEventListener("click", async () => {
      message.textContent = "Signing out...";

      const { error } = await supabase.auth.signOut();

      if (error) {
        message.textContent = error.message;
        return;
      }

      showSession(false);
      message.textContent = "Signed out.";
    });

    const { data, error } = await supabase.auth.getSession();

    if (error) {
      message.textContent = error.message;
    } else {
      showSession(Boolean(data.session));
    }
  </script>
</body>
</html>

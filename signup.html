<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Create Account — Grove</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 390px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 3px;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #f5f5f5;
      color: #080808;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }

    .links {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 13px;
    }

    a {
      color: white;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main>

    <div class="logo">GROVE</div>
    <div class="subtitle">A WORLD CONNECTED</div>

    <h2>Create your account.</h2>

    <form id="signup-form">

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        autocomplete="username"
        placeholder="Choose a username"
        minlength="3"
        maxlength="24"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        placeholder="Your email address"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="new-password"
        placeholder="Create a password"
        minlength="8"
        required
      >

      <button type="submit">CREATE ACCOUNT</button>

    </form>

    <div class="links">
      Already a member? <a href="login.html">Sign in</a>
    </div>

    <a class="back" href="index.html">← Back to Grove</a>

  </main>

  <script src="js/supabase.js"></script>
  <script src="js/signup.js"></script>

</body>
  </html>

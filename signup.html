<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Grove</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="brand">GROVE.</div>

    <section class="auth-card">
      <h2>CREATE YOUR ACCOUNT</h2>

      <form data-auth-form="signup">
        <label for="display-name">DISPLAY NAME</label>
        <input
          id="display-name"
          name="display_name"
          type="text"
          maxlength="40"
          autocomplete="name"
          placeholder="Your name"
        >

        <label for="username">USERNAME</label>
        <input
          id="username"
          name="username"
          type="text"
          minlength="3"
          maxlength="24"
          pattern="[A-Za-z0-9_]{3,24}"
          autocomplete="username"
          required
          placeholder="your_username"
        >

        <label for="email">EMAIL</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        >

        <label for="password">PASSWORD</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="At least 8 characters"
        >

        <button type="submit">CREATE ACCOUNT</button>
        <p class="auth-status" data-auth-status aria-live="polite"></p>
      </form>
    </section>

    <nav class="auth-links">
      Already have an account?
      <a href="login.html">Log in</a><br>
      <a href="index.html">Back to Grove</a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Grove</title>
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="index.html">GROVE.</a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="feed.html">COMMUNITY</a>
      <a href="profile.html">MY PROFILE</a>
      <a href="follows.html">FOLLOWERS</a>
      <a href="notifications-settings.html">SETTINGS</a>
      <button id="logout-button" type="button">LOG OUT</button>
    </nav>
  </header>

  <main class="notifications-shell">
    <header class="page-heading">
      <p class="eyebrow">GROVE ACTIVITY</p>
      <h1>Notifications</h1>
      <p>Your follows, requests, likes, and comments.</p>
    </header>

    <section class="notification-toolbar">
      <p id="notification-status" class="status" role="status"
        aria-live="polite">Loading notifications...</p>

      <div class="toolbar-actions">
        <button id="enable-sound-button" type="button">
          ENABLE SOUND HERE
        </button>
        <button id="mark-all-button" type="button">MARK ALL READ</button>
        <button id="refresh-button" type="button">REFRESH</button>
      </div>
    </section>

    <p id="sound-status" class="status">
      Sound requires one click here to unlock browser audio.
    </p>

    <div id="notification-list" class="notification-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>

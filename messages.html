<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Messages — Grove</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 6%;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    header a {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 290px 1fr;
    }

    .sidebar {
      border-right: 1px solid #222;
      padding: 22px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 22px;
    }

    .conversation-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .conversation {
      padding: 15px;
      background: #111;
      border: 1px solid #222;
      border-radius: 3px;
      color: #aaa;
      cursor: pointer;
    }

    .conversation:hover,
    .conversation.active {
      background: #191919;
      color: white;
    }

    .chat {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 20px;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 75%;
      width: fit-content;
      padding: 12px 15px;
      background: #171717;
      border: 1px solid #292929;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.own {
      align-self: flex-end;
      background: #252525;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-top: 1px solid #222;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      background: #111;
      color: white;
      border: 1px solid #292929;
      border-radius: 3px;
      outline: none;
    }

    .composer button {
      padding: 0 22px;
      background: white;
      color: black;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .layout {
        grid-template-columns: 105px 1fr;
      }

      .sidebar {
        padding: 12px 7px;
      }

      .sidebar h2 {
        font-size: 10px;
        text-align: center;
      }

      .conversation {
        padding: 12px 5px;
        text-align: center;
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .chat-messages {
        padding: 12px;
      }

      .composer {
        padding: 10px;
      }

      .composer button {
        padding: 0 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">GROVE</div>
    <a href="profile.html">Profile</a>
  </header>

  <main class="layout">

    <aside class="sidebar">
      <h2>MESSAGES</h2>

      <div class="conversation-list" id="conversation-list">
        <p style="color:#666;font-size:12px;">
          Loading conversations...
        </p>
      </div>
    </aside>

    <section class="chat">

      <div class="chat-header" id="chat-header">
        Select a conversation
      </div>

      <div class="chat-messages" id="chat-messages">
        <p style="color:#666;font-size:13px;">
          Your conversations will appear here.
        </p>
      </div>

      <form class="composer" id="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Write a message..."
          autocomplete="off"
          required
        >

        <button type="submit">SEND</button>
      </form>

    </section>

  </main>

  <script src="js/supabase.js"></script>
  <script src="js/messages.js"></script>

</body>
</html>

<section id="partner-tag-settings" aria-labelledby="partner-tag-heading">
  <h2 id="partner-tag-heading">Partner tag</h2>
  <p class="field-hint">
    Search for a Grove member and request a Partner tag.
    They must accept before the tag appears publicly.
  </p>

  <label for="partner-tag-username">Search Grove members</label>
  <input
    id="partner-tag-username"
    type="text"
    maxlength="60"
    autocomplete="off"
    placeholder="Search username or display name"
  >

  <button id="partner-tag-send" class="button primary" type="button">
    Send tag request
  </button>

  <p id="partner-tag-status" class="field-hint"
    role="status" aria-live="polite"></p>

  <div id="partner-tag-current" aria-live="polite"></div>

  <h3>Requests sent to you</h3>
  <div id="partner-tag-incoming">
    <p class="field-hint">Loading requests...</p>
  </div>
</section>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Edit Profile — Grove</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 25px 20px;
    }

    header {
      max-width: 650px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 22px;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    a {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
    }

    a:hover {
      color: white;
    }

    main {
      max-width: 550px;
      margin: 45px auto;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .description {
      color: #777;
      font-size: 13px;
      margin-bottom: 35px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 9px;
    }

    input, textarea {
      width: 100%;
      background: #111;
      border: 1px solid #292929;
      border-radius: 3px;
      padding: 14px;
      color: white;
      outline: none;
      margin-bottom: 24px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #777;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      background: white;
      color: black;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }

    .status {
      margin-top: 18px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">GROVE</div>
    <a href="profile.html">← Back to profile</a>
  </header>

  <main>

    <h1>Edit profile</h1>

    <p class="description">
      Customize how other members see you.
    </p>

    <form id="edit-profile-form">

      <label for="display-name">Display name</label>
      <input
        id="display-name"
        name="display_name"
        type="text"
        maxlength="50"
        placeholder="Your display name"
      >

      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="24"
        placeholder="Your username"
        required
      >

      <label for="bio">Bio</label>
      <textarea
        id="bio"
        name="bio"
        maxlength="500"
        placeholder="Tell the Grove community about yourself."
      ></textarea>

      <label for="avatar-url">Avatar image URL</label>
      <input
        id="avatar-url"
        name="avatar_url"
        type="url"
        placeholder="https://..."
      >

      <label for="cover-url">Cover image URL</label>
      <input
        id="cover-url"
        name="cover_url"
        type="url"
        placeholder="https://..."
      >

      <button type="submit">SAVE CHANGES</button>

      <p class="status" id="edit-status"></p>

    </form>

  </main>

  <script src="js/supabase.js"></script>
  <script src="js/complete-profile.js"></script>
  <script src="js/edit-profile.js"></script>

</body>
    </html>

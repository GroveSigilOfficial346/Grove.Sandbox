<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <meta name="description" content="Connect with the Grove community.">

  <title>Grove Community</title>

  <link rel="icon" type="image/svg+xml" href="/assets/neural-tree.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/community.css?v=20261105-2">
  <link rel="stylesheet" href="/css/grove-ui.css?v=20261105-1">
  <link rel="stylesheet" href="/css/grove-warm-controls.css?v=20261111-2">

  <script type="module" src="/js/community.js?v=20261105-2"></script>
  <script type="module" src="/js/community-audio.js?v=20261111-1"></script>
  <script type="module" src="/js/grove-link-previews.js?v=20261106-1"></script>
  <script defer src="/js/grove-media-previews.js?v=20261110-1"></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Grove home">
      <img src="/assets/neural-tree.svg" alt="">
      <span>GROVE</span>
    </a>

    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/community.html" aria-current="page">Community</a>
      <a href="/news-feed.html">Following</a>
      <a href="/discover.html">Discover</a>
      <a href="/live.html">Live</a>
      <a href="/profile.html">Profile</a>
      <a href="/messages.html">Messages</a>
    </nav>
  </header>

  <main class="community-container">
    <section class="community-heading">
      <div>
        <p class="eyebrow">GROVE NETWORK</p>
        <h1>Community</h1>
        <p class="muted">See what members are sharing.</p>
      </div>

      <button
        id="share-grove"
        class="button secondary share-grove-button"
        type="button"
      >↗ Share Grove</button>
    </section>

    <p
      id="community-status"
      class="status-message"
      role="status"
      aria-live="polite"
    >Loading community...</p>

    <section class="composer panel" aria-labelledby="composer-title">
      <h2 id="composer-title">Create a post</h2>

      <form id="post-form">
        <label class="sr-only" for="post-body">
          What's on your mind?
        </label>

        <textarea
          id="post-body"
          maxlength="5000"
          rows="4"
          placeholder="What's on your mind? Paste a link from another platform to share it with Grove."
        ></textarea>

        <div class="composer-options">
          <label class="file-button" for="post-images">
            Add images
          </label>

          <input
            id="post-images"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            multiple
            hidden
          >

          <label class="file-button" for="post-audio">
            Add audio
          </label>

          <input
            id="post-audio"
            type="file"
            accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/wav,audio/x-wav,audio/ogg,audio/webm,audio/aac"
            hidden
          >

          <label class="visibility-control" for="post-visibility">
            Post visibility

            <select id="post-visibility">
              <option value="public">Public</option>
              <option value="followers">Followers</option>
              <option value="private">Only me</option>
            </select>
          </label>

          <button
            id="publish-post"
            class="button primary"
            type="submit"
          >Publish</button>
        </div>

        <p id="selected-images" class="muted"></p>
        <p id="selected-audio" class="muted" aria-live="polite"></p>

        <p
          id="composer-status"
          class="status-message"
          role="status"
          aria-live="polite"
        ></p>
      </form>
    </section>

    <section
      id="pinned-community-section"
      class="pinned-community-section"
      aria-labelledby="pinned-community-title"
      hidden
    >
      <div class="feed-heading">
        <h2 id="pinned-community-title">📌 Pinned posts</h2>
      </div>

      <div id="pinned-community-feed" class="community-feed"></div>
    </section>

    <section class="feed-section" aria-labelledby="feed-title">
      <div class="feed-heading">
        <h2 id="feed-title">Latest posts</h2>

        <button
          id="refresh-feed"
          class="button secondary"
          type="button"
        >Refresh</button>
      </div>

      <div
        id="community-feed"
        class="community-feed"
        aria-live="polite"
      >
        <p class="muted">Loading posts...</p>
      </div>
    </section>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <meta name="description" content="Connect with the Grove community.">
  <title>Grove Community</title>

  <link rel="stylesheet" href="css/community.css">
  <script type="module" src="js/community.js"></script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="/">GROVE</a>

    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/community.html" aria-current="page">Community</a>
      <a href="/profile.html">Profile</a>
      <a href="/messages.html">Messages</a>
    </nav>
  </header>

  <main class="community-container">
    <section class="community-heading">
      <p class="eyebrow">GROVE NETWORK</p>
      <h1>Community</h1>
      <p class="muted">See what members are sharing.</p>
    </section>

    <p id="community-status" class="status-message" role="status" aria-live="polite">
      Loading community...
    </p>

    <section class="composer panel" aria-labelledby="composer-title">
      <h2 id="composer-title">Create a post</h2>

      <form id="post-form">
        <label class="sr-only" for="post-body">What's on your mind?</label>
        <textarea
          id="post-body"
          maxlength="5000"
          rows="4"
          placeholder="What's on your mind?"
        ></textarea>

        <div class="composer-options">
          <label class="file-button" for="post-images">
            Add images
          </label>

          <input
            id="post-images"
            type="file"
            accept="image/*"
            multiple
            hidden
          >

          <label class="visibility-control" for="post-visibility">
            Post visibility
            <select id="post-visibility">
              <option value="public">Public</option>
              <option value="followers">Followers</option>
              <option value="private">Only me</option>
            </select>
          </label>

          <button id="publish-post" class="button primary" type="submit">
            Publish
          </button>
        </div>

        <p id="selected-images" class="muted"></p>
        <p id="composer-status" class="status-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="feed-section" aria-labelledby="feed-title">
      <div class="feed-heading">
        <h2 id="feed-title">Latest posts</h2>
        <button id="refresh-feed" class="button secondary" type="button">
          Refresh
        </button>
      </div>

      <div id="community-feed" class="community-feed" aria-live="polite">
        <p class="muted">Loading posts...</p>
      </div>
    </section>
  </main>
</body>
</html>

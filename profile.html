<DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <meta name="description" content="View your Grove member profile.">

  <title>Grove Profile</title>

  <link rel="stylesheet" href="css/profile.css?v=20261105-1">
  <link rel="stylesheet" href="css/profile-pins.css?v=20261105-1">
  <link rel="stylesheet" href="css/profile-social.css?v=20261105-1">

  <script type="module" src="js/profile-view.js?v=20261105-1"></script>
  <script type="module" src="js/profile-pins.js?v=20261105-1"></script>
  <script type="module" src="js/profile-mobile-compat.js?v=20261105-1"></script>
  <script type="module" src="js/profile-social.js?v=20261105-1"></script>
</head>

<body>

  <header class="site-header">
    <a class="brand" href="/">GROVE</a>

    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/community.html">Community</a>
      <a href="/profile.html" aria-current="page">Profile</a>
      <a href="/messages.html">Messages</a>
    </nav>
  </header>

  <main class="page-container">

    <p
      id="status"
      class="status-message"
      role="status"
      aria-live="polite"
    >Loading profile...</p>

    <section class="profile-card">

      <div
        id="cover"
        class="profile-cover"
        role="img"
        aria-label="Profile cover image"
      ></div>

      <div class="profile-main">

        <div class="profile-heading">

          <div
            id="avatar"
            class="profile-avatar"
            role="img"
            aria-label="Profile picture"
          >G</div>

          <div class="profile-identity">
            <h1 id="display-name">Grove Member</h1>
            <p id="username" class="muted"></p>
          </div>

        </div>

        <p id="bio" class="profile-bio">No bio yet.</p>

        <div id="details" class="profile-details"></div>

        <div
          id="profile-stats"
          class="profile-stats"
          aria-label="Profile statistics"
        ></div>

        <div class="profile-actions">

          <button
            id="follow-button"
            class="button primary"
            type="button"
            hidden
          >Follow</button>

          <button
            id="message-button"
            class="button secondary"
            type="button"
            hidden
          >Message</button>

          <button
            id="edit-profile-button"
            class="button secondary"
            type="button"
            hidden
          >Edit profile</button>

        </div>

        <div id="profile-upload-actions" class="upload-actions" hidden>

          <button
            id="avatar-upload-button"
            class="button secondary"
            type="button"
          >Change avatar</button>

          <input
            id="avatar-file"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            hidden
          >

          <button
            id="cover-upload-button"
            class="button secondary"
            type="button"
          >Change cover</button>

          <input
            id="cover-file"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            hidden
          >

        </div>

        <p
          id="action-status"
          class="status-message"
          role="status"
          aria-live="polite"
        ></p>

      </div>
    </section>

    <section id="music-section" class="content-section" hidden>
      <h2>Profile music</h2>
      <div id="music-content"></div>
    </section>

    <section
      id="profile-social-tabs"
      class="profile-social-tabs"
      aria-label="Profile content tabs"
    >
      <button
        class="profile-social-tab active"
        type="button"
        data-profile-tab="posts"
        aria-selected="true"
      >Posts</button>

      <button
        class="profile-social-tab"
        type="button"
        data-profile-tab="reposts"
        aria-selected="false"
      >Reposts</button>
    </section>

    <section id="posts-section" class="content-section">
      <h2>Posts</h2>

      <div id="posts-list">
        <p class="muted">Posts will appear here.</p>
      </div>
    </section>

    <section
      id="reposts-section"
      class="content-section profile-reposts-section"
      hidden
    >
      <h2>Reposts</h2>

      <p
        id="reposts-status"
        class="muted"
        role="status"
        aria-live="polite"
      ></p>

      <div id="reposts-list"></div>
    </section>

  </main>

</body>
</html>

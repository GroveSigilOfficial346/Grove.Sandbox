<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <meta name="description" content="View your Grove member profile.">

  <title>Grove Profile</title>

  <link rel="stylesheet" href="css/profile.css?v=20261105-2">
  <link rel="stylesheet" href="css/profile-pins.css?v=20261105-2">
  <link rel="stylesheet" href="css/profile-social.css?v=20261105-2">
  <link rel="stylesheet" href="css/profile-post-actions.css?v=20261105-2">
  <link rel="stylesheet" href="css/profile-quick-edit.css?v=20261105-2">
  <link rel="stylesheet" href="css/profile-relationship.css?v=20261105-3">
  <link rel="stylesheet" href="css/profile-post-composer.css?v=20261106-1">

  <script type="module" src="js/profile-view.js?v=20261105-2"></script>
  <script type="module" src="js/profile-pins.js?v=20261105-2"></script>
  <script type="module" src="js/profile-mobile-compat.js?v=20261105-2"></script>
  <script type="module" src="js/profile-social.js?v=20261105-2"></script>
  <script type="module" src="js/profile-post-actions.js?v=20261105-2"></script>
  <script type="module" src="js/profile-quick-edit.js?v=20261105-2"></script>
  <script type="module" src="js/profile-relationship-display.js?v=20261105-3"></script>
  <script type="module" src="js/profile-followers.js?v=20261105-1"></script>
  <script type="module" src="js/member-safety.js?v=20261105-1"></script>
  <script type="module" src="js/profile-post-composer.js?v=20261106-1"></script>
</head>

<body>

  <header class="site-header">
    <a class="brand" href="/">GROVE</a>

    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/community.html">Community</a>
      <a href="/profile.html" aria-current="page">Profile</a>
      <a href="/messages.html">Messages</a>
    </nav>
  </header>

  <main class="page-container">

    <p id="status" class="status-message" role="status" aria-live="polite">
      Loading profile...
    </p>

    <section class="profile-card">

      <div id="cover" class="profile-cover" role="img" aria-label="Profile cover image"></div>

      <div class="profile-main">

        <div class="profile-heading">

          <div id="avatar" class="profile-avatar" role="img" aria-label="Profile picture">G</div>

          <div class="profile-identity">
            <h1 id="display-name">Grove Member</h1>
            <p id="username" class="muted"></p>
          </div>

        </div>

        <p id="bio" class="profile-bio">No bio yet.</p>

        <div id="details" class="profile-details"></div>

        <div id="profile-stats" class="profile-stats" aria-label="Profile statistics"></div>

        <div class="profile-actions">

          <button id="follow-button" class="button primary" type="button" hidden>Follow</button>

          <button id="message-button" class="button secondary" type="button" hidden>Message</button>

          <button id="edit-profile-button" class="button secondary" type="button" hidden>Edit profile</button>

        </div>

        <div id="profile-upload-actions" class="upload-actions" hidden>

          <button id="avatar-upload-button" class="button secondary" type="button">
            Change avatar
          </button>

          <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

          <button id="cover-upload-button" class="button secondary" type="button">
            Change cover
          </button>

          <input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

        </div>

        <p id="action-status" class="status-message" role="status" aria-live="polite"></p>

      </div>
    </section>

    <section id="music-section" class="content-section" hidden>
      <h2>Profile music</h2>
      <div id="music-content"></div>
    </section>

    <section id="profile-social-tabs" class="profile-social-tabs" aria-label="Profile content tabs">

      <button class="profile-social-tab active" type="button" data-profile-tab="posts" aria-selected="true">
        Posts
      </button>

      <button class="profile-social-tab" type="button" data-profile-tab="reposts" aria-selected="false">
        Reposts
      </button>

    </section>

    <section id="posts-section" class="content-section">
      <h2>Posts</h2>

      <div id="profile-post-composer" class="profile-post-composer" hidden>

        <form id="profile-post-form">

          <label for="profile-post-body">Share something with Grove</label>

          <textarea
            id="profile-post-body"
            maxlength="5000"
            rows="4"
            placeholder="What's on your mind?"
          ></textarea>

          <div class="profile-post-composer-meta">
            <span id="profile-post-counter">0 / 5000</span>
            <span>Text and images supported</span>
          </div>

          <label for="profile-post-images" class="profile-post-file-label">
            <span>＋ Add images</span>
            <small>Up to 10 images · 5 MB each</small>
          </label>

          <input
            id="profile-post-images"
            type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            multiple
            hidden
          >

          <div id="profile-post-preview" class="profile-post-preview"></div>

          <label for="profile-post-visibility">Who can see this post?</label>

          <select id="profile-post-visibility">
            <option value="public">Public</option>
            <option value="followers">Followers</option>
            <option value="private">Only me</option>
          </select>

          <div class="profile-post-submit-row">
            <p id="profile-post-status" role="status" aria-live="polite"></p>

            <button id="profile-post-submit" class="button primary" type="submit">
              Publish post
            </button>
          </div>

        </form>

      </div>

      <div id="posts-list">
        <p class="muted">Posts will appear here.</p>
      </div>
    </section>

    <section id="reposts-section" class="content-section profile-reposts-section" hidden>

      <h2>Reposts</h2>

      <p id="reposts-status" class="muted" role="status" aria-live="polite"></p>

      <div id="reposts-list"></div>

    </section>

  </main>

</body>
</html>

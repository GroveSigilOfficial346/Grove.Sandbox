<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <title>My Profile — Grove</title>
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      display: block;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px 16px 48px;
      color: #f7f5ff;
    }

    .profile-app {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand {
      color: #f7f5ff;
      font-size: 19px;
      letter-spacing: 5px;
      text-decoration: none;
    }

    .panel {
      padding: clamp(20px, 5vw, 34px);
      border: 1px solid #851eff55;
      border-radius: 18px;
      background: #100b25eF;
      box-shadow: 0 12px 50px #0005;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 1px;
      text-indent: 0;
      background: none;
      color: #f7f5ff;
    }

    .intro {
      margin: 0 0 26px;
      color: #bdb3dc;
      line-height: 1.6;
      font-size: 14px;
    }

    .avatar-preview {
      display: block;
      width: 104px;
      height: 104px;
      object-fit: cover;
      margin: 0 0 12px;
      border: 2px solid #a855f7;
      border-radius: 50%;
      background: #21143e;
    }

    .field {
      margin: 18px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d9cafa;
      font-size: 13px;
      font-weight: 600;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #57427e;
      border-radius: 9px;
      outline: none;
      background: #08051a;
      color: #f7f5ff;
      font: inherit;
      font-size: 14px;
    }

    input:focus, textarea:focus {
      border-color: #05c9f4;
      box-shadow: 0 0 0 3px #05c9f422;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
      font-size: 12px;
    }

    .hint {
      margin: 7px 0 0;
      color: #a99bc9;
      font-size: 12px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    button, .button-link {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 12px 18px;
      border: 1px solid #851eff88;
      border-radius: 9px;
      background: linear-gradient(110deg, #851eff, #5965ff);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    button.secondary {
      background: #10082d;
      border-color: #05c9f466;
      color: #c9f8ff;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      min-height: 22px;
      margin: 18px 0 0;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #status[data-kind="error"] { color: #ff9caa; }
    #status[data-kind="success"] { color: #7bd7a2; }

    .public-link {
      margin-top: 22px;
      color: #c9b9ed;
      font-size: 13px;
    }

    .public-link a { color: #45e5ff; }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/profile.js" defer></script>
</head>
<body>
  <main class="profile-app">
    <header class="topbar">
      <a class="brand" href="index.html">GROVE</a>
      <a class="button-link" href="index.html">Home</a>
    </header>

    <section class="panel">
      <h1>Your Profile</h1>
      <p class="intro">Shape how the Grove community sees you.</p>

      <form id="profile-form">
        <div class="field">
          <label for="avatar">Profile picture</label>
          <img id="avatar-preview" class="avatar-preview" alt="Profile picture preview" hidden>
          <input id="avatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <p class="hint">Optional. JPG, PNG, WebP or GIF, maximum 5 MB.</p>
        </div>

        <div class="field">
          <label for="cover">Profile background image</label>
          <input id="cover" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <p class="hint">Optional. Maximum 5 MB.</p>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" maxlength="30" autocomplete="username" placeholder="yourusername" pattern="[A-Za-z0-9_]+" title="Use letters, numbers, and underscores only">
          <p class="hint">Letters, numbers, and underscores only.</p>
        </div>

        <div class="field">
          <label for="display-name">Display name</label>
          <input id="display-name" name="display_name" maxlength="60" autocomplete="nickname" placeholder="How people know you">
        </div>

        <div class="field">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" maxlength="500" placeholder="Tell the community a little about yourself..."></textarea>
        </div>

        <div class="field">
          <label for="location">Location</label>
          <input id="location" name="location" maxlength="100" autocomplete="address-level2" placeholder="City or region (optional)">
        </div>

        <div class="field">
          <label for="pronouns">Pronouns</label>
          <input id="pronouns" name="pronouns" maxlength="40" placeholder="Optional">
        </div>

        <div class="field">
          <label for="website">Website</label>
          <input id="website" name="website" type="url" maxlength="300" placeholder="https://example.com" autocomplete="url">
        </div>

        <div class="actions">
          <button id="save-profile" type="submit">Save Profile</button>
          <button id="logout" class="secondary" type="button">Log Out</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="public-link">
        Your profile ID: <span id="profile-id">Loading…</span>
      </p>
    </section>
  </main>
</body>
</html>

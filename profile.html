<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050019">
  <meta name="description" content="View a member profile on Grove.">
  <title>Profile — Grove</title>
  <link rel="stylesheet" href="css/global.css">

  <style>
    body {
      display: block;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px 16px 60px;
      color: #f7f5ff;
    }

    .profile-app {
      width: min(100%, 900px);
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand {
      color: #f7f5ff;
      font-size: 19px;
      letter-spacing: 5px;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-actions a {
      padding: 10px 15px;
      border: 1px solid #851eff66;
      border-radius: 9px;
      color: #eee5ff;
      background: #100b25;
      text-decoration: none;
      font-size: 13px;
    }

    .top-actions a:hover,
    .edit-profile-link:hover {
      filter: brightness(1.15);
    }

    .profile-card {
      overflow: hidden;
      border: 1px solid #851eff55;
      border-radius: 20px;
      background: #100b25;
      box-shadow: 0 15px 55px #0006;
    }

    .cover {
      height: 260px;
      background:
        radial-gradient(ellipse at 50% 100%, #851eff55, transparent 65%),
        linear-gradient(120deg, #08051a, #171044, #08051a);
      background-position: center;
      background-size: cover;
    }

    .profile-content {
      position: relative;
      padding: 0 32px 30px;
    }

    .avatar {
      width: 132px;
      height: 132px;
      margin-top: -66px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 5px solid #100b25;
      border-radius: 50%;
      background: linear-gradient(135deg, #851eff, #353bff);
      color: white;
      font-size: 42px;
      font-weight: 700;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .name {
      margin: 0;
      color: #fff;
      font-size: clamp(25px, 5vw, 34px);
      overflow-wrap: anywhere;
    }

    .username {
      margin: 5px 0 0;
      color: #b9a7df;
      font-size: 14px;
    }

    .profile-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .edit-profile-link {
      display: inline-block;
      padding: 11px 17px;
      border: 1px solid #851eff88;
      border-radius: 9px;
      background: linear-gradient(110deg, #851eff, #5965ff);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .bio {
      max-width: 650px;
      margin: 23px 0 0;
      color: #e0d9f0;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 18px;
      color: #a99bc9;
      font-size: 13px;
    }

    .details a {
      color: #45e5ff;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 24px;
      padding: 25px 28px;
      border: 1px solid #851eff44;
      border-radius: 16px;
      background: #100b25;
    }

    .section h2 {
      margin: 0 0 10px;
      color: #f7f5ff;
      font-size: 19px;
    }

    .posts-list {
      display: grid;
      gap: 16px;
    }

    .empty-state {
      padding: 24px 10px;
      color: #a99bc9;
      text-align: center;
      line-height: 1.7;
    }

    #status {
      margin: 24px 0;
      color: #ff9caa;
      text-align: center;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px 40px;
      }

      .cover {
        height: 190px;
      }

      .profile-content {
        padding: 0 20px 25px;
      }

      .avatar {
        width: 108px;
        height: 108px;
        margin-top: -54px;
      }

      .section {
        padding: 20px;
      }

      .topbar {
        align-items: flex-start;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/profile-view.js" defer></script>
  <script src="js/app-shell.js" defer></script>
</head>

<body>
  <main class="profile-app">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Grove home">GROVE</a>

      <nav class="top-actions" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="settings.html" id="settings-link" hidden>Settings</a>
      </nav>
    </header>

    <p id="status" role="status" aria-live="polite">
      Loading profile…
    </p>

    <section
      class="profile-card"
      id="profile-card"
      aria-label="Member profile"
      hidden
    >
      <div class="cover" id="cover" aria-label="Profile cover photo"></div>

      <div class="profile-content">
        <div class="avatar" id="avatar">
        </div>

        <div class="profile-heading">
          <div>
            <h1 class="name" id="display-name"></h1>
            <p class="username" id="username"></p>
          </div>

          <div class="profile-actions">
            <a
              class="edit-profile-link"
              id="edit-profile-link"
              href="edit-profile.html"
              hidden
            >
              Edit Profile
            </a>
          </div>
        </div>

        <p class="bio" id="bio" hidden></p>

        <div class="details" id="details"></div>
      </div>
    </section>

    <section
      class="section"
      id="posts-section"
      aria-labelledby="posts-heading"
      hidden
    >
      <h2 id="posts-heading">Posts</h2>

      <div class="posts-list" id="posts-list">
        <div class="empty-state" id="posts-empty">
          This member hasn't posted anything yet.
        </div>
      </div>
    </section>
  </main>
</body>
</html>

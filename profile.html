<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Profile — Grove</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 7%;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
    }

    nav a:hover {
      color: white;
    }

    main {
      max-width: 850px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .cover {
      height: 190px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 4px;
    }

    .profile-info {
      padding: 0 20px;
      margin-top: -48px;
      position: relative;
    }

    .avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: #222;
      border: 4px solid #080808;
      object-fit: cover;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: -55px;
      min-height: 55px;
    }

    .edit {
      color: white;
      text-decoration: none;
      border: 1px solid #444;
      padding: 10px 18px;
      border-radius: 3px;
      font-size: 12px;
    }

    .edit:hover {
      background: #1b1b1b;
    }

    h1 {
      font-size: 25px;
      margin-top: 18px;
    }

    .username {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .bio {
      color: #bbb;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 18px;
    }

    .stats {
      display: flex;
      gap: 28px;
      margin-top: 22px;
      font-size: 13px;
      color: #888;
    }

    .stats strong {
      color: white;
    }

    .posts {
      margin-top: 45px;
      border-top: 1px solid #222;
      padding-top: 25px;
    }

    .posts h2 {
      font-size: 15px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 45px 10px;
      border: 1px solid #222;
      border-radius: 3px;
      font-size: 13px;
    }

    @media (max-width: 550px) {
      header {
        padding: 18px 20px;
      }

      nav {
        gap: 12px;
      }

      nav a {
        font-size: 11px;
      }

      main {
        margin-top: 25px;
      }

      .cover {
        height: 145px;
      }

      .avatar {
        width: 85px;
        height: 85px;
      }

      .profile-info {
        padding: 0 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">GROVE</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="messages.html">Messages</a>
      <a href="login.html">Account</a>
    </nav>
  </header>

  <main>

    <section class="cover" id="profile-cover"></section>

    <section class="profile-info">

      <img
        class="avatar"
        id="profile-avatar"
        src="assets/default-avatar.png"
        alt="Profile picture"
      >

      <div class="actions">
        <a class="edit" href="edit-profile.html">EDIT PROFILE</a>
      </div>

      <h1 id="display-name">Member</h1>

      <p class="username" id="username">@username</p>

      <p class="bio" id="profile-bio">
        Welcome to Grove.
      </p>

      <div class="stats">
        <span><strong id="posts-count">0</strong> Posts</span>
        <span><strong id="followers-count">0</strong> Followers</span>
        <span><strong id="following-count">0</strong> Following</span>
      </div>

    </section>

    <section class="posts">
      <h2>POSTS</h2>

      <div class="empty" id="profile-posts">
        No posts yet.
      </div>
    </section>

  </main>

  <script src="js/supabase.js"></script>
  <script src="js/profile-guard.js"></script>
  <script src="js/profile-view.js"></script>

</body>
  </html>
